name: Deploy Dictionary API to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vps-dictionary-api
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.VPS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare restricted SSH access
        env:
          DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          VPS_KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Build and deploy image
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          docker build --pull -f Dockerfile -t migration-dictionary-api:latest .
          docker save migration-dictionary-api:latest | gzip -1 | ssh -T -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "ubuntu@$VPS_HOST" \
            "gzip -dc | sudo docker load && sudo cp -n /opt/migration/apps/Dictionary-API/data/wordnet.db /opt/migration/apps/Dictionary-API/data/wordnet.db.pre-unified && sudo docker run --rm --name dictionary-db-migration -v /opt/migration/apps/Dictionary-API/data:/app/data migration-dictionary-api:latest python -c 'import shutil,sys; free=shutil.disk_usage(\"/app/data\").free; print(\"free_bytes_before_unified_import=\",free); sys.exit(0 if free >= 3000000000 else 42)' && sudo docker run --rm --name dictionary-db-migration -v /opt/migration/apps/Dictionary-API/data:/app/data migration-dictionary-api:latest python -m app.infrastructure.db.merge_dictionary_sources --database /app/data/wordnet.db --ecdict-database /app/data/ecdict-release-28.db --cache-database /app/data/words.db --complete-dictionary-archive /app/data/Complete_Dictionary.7z --word-atlas-data /app/app/infrastructure/db/word_atlas_source.json && sudo docker run --rm --name dictionary-db-verification -v /opt/migration/apps/Dictionary-API/data:/app/data migration-dictionary-api:latest python -c 'import sqlite3,sys; c=sqlite3.connect(\"/app/data/wordnet.db\"); integrity=c.execute(\"pragma integrity_check\").fetchone()[0]; counts={t:c.execute(\"select count(*) from \"+t).fetchone()[0] for t in (\"senses\",\"word_atlas\",\"complete_dictionary\",\"ecdict_entries\")}; print(\"integrity_check=\",integrity,\"counts=\",counts); sys.exit(0 if integrity==\"ok\" and counts[\"word_atlas\"]==7298 and counts[\"complete_dictionary\"]==770611 and counts[\"ecdict_entries\"]>=3000000 else 43)' && cd /opt/migration && sudo docker compose up -d --no-deps --force-recreate dictionary-api && sudo docker exec migration-dictionary-api python -c 'import json,urllib.request; from app.infrastructure.db.ecdict_repository import EcdictRepository; assert EcdictRepository().get_word(\"hello\"); data=json.loads(urllib.request.urlopen(\"http://127.0.0.1:8000/word/above\",timeout=20).read()); assert len(data[\"word_atlas\"][\"ex\"])>=1 and data[\"complete_dictionary\"]; print(\"live_lookup=ok\")' && sudo docker ps --filter name=migration-dictionary-api"
